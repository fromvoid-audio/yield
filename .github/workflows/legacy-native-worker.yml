name: Native Legacy worker
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/legacy-native-worker.yml'
      - 'scripts/internal/validation/verify_legacy_native_worker.sh'
permissions:
  contents: read
concurrency:
  group: legacy-native-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-registry-worker:
    name: Isolated-registry Legacy worker (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: initial-and-lost-reply
            test: operation_journal::owner::legacy_adoption_custody::tests::legacy_initial_native_actual_worker_commit_duplicate_lost_reply_and_source_fence
          - case: transaction-faults
            test: operation_journal::owner::legacy_adoption_custody::tests::legacy_initial_native_actual_worker_commit_faults_keep_same_source_slot_and_refuse_readmission
          - case: migration-bootstrap-recovery
            test: operation_journal::owner::legacy_adoption_custody::tests::legacy_migration_native_actual_worker_commits_original_receipt_and_coalesces_lost_reply
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      YIELD_NATIVE_LEGACY_CASE: ${{ matrix.test }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup show active-toolchain # reads rust-toolchain.toml
      - name: Reuse pinned native build dependencies
        id: native-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: legacy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            legacy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Verify original Legacy worker on native APFS
        run: bash scripts/internal/validation/verify_legacy_native_worker.sh
      - name: Preserve native evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-native-worker-${{ matrix.case }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/legacy-native-worker/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve pinned build cache after a failed native check
        if: failure() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: legacy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}

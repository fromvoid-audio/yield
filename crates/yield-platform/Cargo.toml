[package]
name = "yield-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Controlled loopback fixture construction; absent from normal application builds.
test-support = []

[dependencies]
yield-core.workspace = true
url = "=2.5.8"
webpki-roots = "=0.26.11"
base64 = "=0.22.1"
crc32fast = "=1.5.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
flate2 = "=1.1.10"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
unicode-casefold = "=0.2.0"
raw-window-handle.workspace = true
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.27"
toml = "0.8.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
async-channel = "=2.5.0"
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSArray",
    "NSGeometry",
    "NSObject",
    "NSValue",
    "NSString",
    "NSURL",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }
windows-core = { version = "=0.62.2" }

[dev-dependencies]
gpui.workspace = true
tempfile.workspace = true
log = "=0.4.34"

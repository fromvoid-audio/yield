[package]
name = "wavecrate-ui"
version.workspace = true
edition.workspace = true
license = "CC0-1.0 AND Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
raw-window-handle.workspace = true
reson.workspace = true
unicode-segmentation.workspace = true
wavecrate-core.workspace = true
wavecrate-design.workspace = true
wavecrate-media.workspace = true
wavecrate-library.workspace = true
wavecrate-session.workspace = true
wavecrate-platform.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
wavecrate-catalog = { path = "../wavecrate-catalog" }
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

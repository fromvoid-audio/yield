[package]
name = "yield-ui"
version.workspace = true
edition.workspace = true
license = "CC0-1.0 AND Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
rand = "=0.9.5"
gpui.workspace = true
raw-window-handle.workspace = true
reson.workspace = true
unicode-segmentation.workspace = true
yield-core.workspace = true
yield-design.workspace = true
yield-media.workspace = true
yield-library.workspace = true
yield-session.workspace = true
yield-platform.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
yield-catalog = { path = "../yield-catalog" }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
async-channel = "=2.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

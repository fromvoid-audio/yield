[package]
name = "yield-ui"
version.workspace = true
edition.workspace = true
license = "CC0-1.0 AND Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[features]
default = []
development-state = [
    "yield-library/development-state",
    "yield-media/development-state",
]

[dependencies]
rand = "=0.9.5"
semver = "1.0.27"
gpui.workspace = true
raw-window-handle.workspace = true
reson.workspace = true
unicode-segmentation.workspace = true
yield-core.workspace = true
yield-design.workspace = true
yield-media.workspace = true
yield-library.workspace = true
yield-issue-gateway = { path = "../yield-issue-gateway" }
yield-session.workspace = true
yield-platform.workspace = true

[dev-dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
serde_json = "1.0.145"
toml = "0.8.19"
yield-platform = { workspace = true, features = ["test-support"] }
yield-library = { workspace = true, features = ["test-support"] }
naga = { version = "=25.0.1", features = ["wgsl-in"] }
gpui = { workspace = true, features = ["test-support"] }
yield-catalog = { path = "../yield-catalog", features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
async-channel = "=2.5.0"
naga = { version = "=25.0.1", features = ["wgsl-in"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

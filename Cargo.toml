[workspace]
members = [
    "crates/yield",
    "crates/yield-core",
    "crates/yield-aiff",
    "crates/yield-media",
    "crates/yield-design",
    "crates/yield-ui",
    "crates/reson",
    "crates/yield-analysis",
    "crates/yield-library",
    "crates/yield-source-watcher",
    "crates/yield-platform",
    "crates/yield-issue-gateway",
    "crates/yield-catalog",
    "crates/yield-session",
    "crates/yield-scan",
]
default-members = ["crates/yield"]
exclude = ["reference/radiant"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
publish = false

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"

[workspace.dependencies]
# OPT-1917: pinned Blade crashes in CoreAnimation on cross-display window moves.
# The pinned Metal renderer uses runtime shaders so Command Line Tools builds work.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
hound = "3.5.1"
notify = "6.1.1"
unicode-segmentation = "1.12.0"
reson = { path = "crates/reson" }
yield-aiff = { path = "crates/yield-aiff" }
yield-analysis = { path = "crates/yield-analysis" }
yield-library = { path = "crates/yield-library" }
yield-core = { path = "crates/yield-core" }
yield-media = { path = "crates/yield-media" }
yield-design = { path = "crates/yield-design" }
yield-ui = { path = "crates/yield-ui" }
yield-session = { path = "crates/yield-session" }
yield-source-watcher = { path = "crates/yield-source-watcher" }
yield-platform = { path = "crates/yield-platform" }
raw-window-handle = "=0.6.2"
objc2 = { version = "=0.6.4", default-features = false }
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
tempfile = "3.23.0"

# Keep GPUI layout/tessellation and audio decoding optimized in development.
# These dependencies rarely rebuild; unoptimized rendering is not a useful
# interactive development baseline.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.yield-ui]
opt-level = 2

[profile.dev.package.yield-media]
opt-level = 2

[profile.release-local]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 2
strip = "none"

# Keep GPUI at the exact 0.2.2 release while extending the macOS Metal
# compositor with Yield's optional visual WGSL post-pass.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

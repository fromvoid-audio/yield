[workspace]
members = [
    "crates/wavecrate-gpui",
    "crates/wavecrate-core",
    "crates/wavecrate-media",
    "crates/wavecrate-ui",
    "crates/reson",
    "crates/wavecrate-analysis",
    "crates/wavecrate-library",
    "crates/wavecrate-scan",
]
default-members = ["crates/wavecrate-gpui"]
exclude = ["reference/radiant"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
publish = false

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }
hound = "3.5.1"
unicode-segmentation = "1.12.0"
reson = { path = "crates/reson" }
wavecrate-analysis = { path = "crates/wavecrate-analysis" }
wavecrate-library = { path = "crates/wavecrate-library" }
wavecrate-core = { path = "crates/wavecrate-core" }
wavecrate-media = { path = "crates/wavecrate-media" }
wavecrate-ui = { path = "crates/wavecrate-ui" }
tempfile = "3.23.0"

[profile.release-local]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 2
strip = "none"

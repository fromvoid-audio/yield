[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[package]
name = "wavecrate-gpui"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"
missing_docs = "deny"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }
hound = "3.5.1"
rfd = "0.16.0"
reson = { path = "../../crates/reson" }
wavecrate-analysis = { path = "../../crates/wavecrate-analysis" }
wavecrate-library = { path = "../../crates/wavecrate-library" }

[dev-dependencies]
tempfile = "3.23.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wavecrate-gpui"
path = "src/main.rs"
